name: 인스타 자동 게시

on:
  schedule:
    - cron: "*/5 * * * *"    # 5분마다 확인
  workflow_dispatch: {}       # Actions 탭에서 수동 실행 가능

permissions:
  contents: write

concurrency:
  group: insta-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 예약 시간이 지난 게시물 올리기
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python scripts/post_instagram.py

      - name: 게시 결과 기록
        if: always()
        run: |
          git config user.name "insta-bot"
          git config user.email "insta-bot@users.noreply.github.com"
          git add posts || true
          if ! git diff --cached --quiet; then
            git commit -m "게시 결과 기록"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
