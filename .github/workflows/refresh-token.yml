name: 인스타 토큰 갱신

# 장기 토큰은 60일마다 만료되므로 매달 1일·15일에 갱신한다.
# 필요한 시크릿: IG_ACCESS_TOKEN, GH_PAT (저장소 Secrets 쓰기 권한이 있는 GitHub 토큰)

on:
  schedule:
    - cron: "0 18 1,15 * *"   # 한국시간 매달 2일·16일 새벽 3시
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: 토큰 갱신 후 시크릿 교체
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          resp=$(curl -sS --fail-with-body -G "https://graph.instagram.com/refresh_access_token" \
            --data-urlencode "grant_type=ig_refresh_token" \
            --data-urlencode "access_token=${IG_ACCESS_TOKEN}")
          new=$(echo "$resp" | jq -r '.access_token // empty')
          if [ -z "$new" ]; then echo "갱신 실패"; exit 1; fi
          echo "::add-mask::$new"
          gh secret set IG_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY" --body "$new"
          echo "갱신 완료 (만료까지 $(echo "$resp" | jq -r '.expires_in')초)"
